<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Teams Setup Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chosen Palette: Warm Neutrals & Indigo Accent -->
    <!-- Application Structure Plan: The SPA uses a "Wizard/Interactive Selector" structure. Instead of a long, scrolling bilingual document, users select their Language, Device, and Role. The JavaScript then dynamically injects only the specific 4-step instructions they need. This drastically reduces cognitive load. A troubleshooting dashboard is provided at the bottom with an interactive chart to visualize common issues, satisfying the requirement for data visualization while aiding user support. -->
    <!-- Visualization & Content Choices: Source Text -> Goal: Instruct -> Viz: Interactive Step-by-Step Wizard -> Justification: Users only need instructions for their specific context (e.g., Mac Guest), showing everything is overwhelming. | Source Troubleshooting -> Goal: Inform -> Viz: Donut Chart (Chart.js) -> Justification: Highlights the most common pitfalls so users can anticipate them. -> Method: Canvas/Chart.js. Confirming NO SVG/Mermaid. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body { background-color: #f8fafc; }
        .chart-container { position: relative; width: 100%; max-width: 500px; margin-left: auto; margin-right: auto; height: 300px; max-height: 400px; }
        @media (min-width: 768px) { .chart-container { height: 350px; } }
        .step-card { transition: all 0.3s ease; }
        .step-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-indigo-600 text-white rounded flex items-center justify-center font-bold text-xl">T</div>
                <h1 id="nav-title" class="text-xl font-bold text-slate-800">Teams 指南</h1>
            </div>
            <div class="flex bg-slate-100 rounded-lg p-1">
                <button id="lang-en" class="px-3 py-1 rounded-md text-sm font-medium transition-colors text-slate-600 hover:text-slate-900" onclick="setLang('en')">English</button>
                <button id="lang-zh" class="px-3 py-1 rounded-md text-sm font-medium transition-colors bg-white shadow text-indigo-600" onclick="setLang('zh')">繁體中文</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-12">

        <section class="text-center max-w-3xl mx-auto">
            <h2 id="hero-title" class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-4 tracking-tight">安裝及加入會議指南</h2>
            <p id="hero-desc" class="text-lg text-slate-600 leading-relaxed">
                這個互動工具提供量身定制的 Microsoft Teams 安裝與加入指示。請在下方選擇您的裝置與角色，即可立即生成您所需的確切步驟，過濾掉不必要的資訊，讓設定過程更順暢。
            </p>
        </section>

        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="grid grid-cols-1 md:grid-cols-2">
                
                <div class="p-6 md:p-8 border-b md:border-b-0 md:border-r border-slate-200 bg-slate-50">
                    <h3 id="step1-title" class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4">1. 選擇您的裝置</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <button id="btn-desktop" class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-700 transition-all" onclick="setDevice('desktop')">
                            <span class="text-3xl mb-2">💻</span>
                            <span id="label-desktop" class="font-semibold text-sm">電腦版 (Win/Mac)</span>
                        </button>
                        <button id="btn-mobile" class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-transparent bg-white text-slate-600 hover:bg-slate-100 transition-all shadow-sm" onclick="setDevice('mobile')">
                            <span class="text-3xl mb-2">📱</span>
                            <span id="label-mobile" class="font-semibold text-sm">行動裝置 (iOS/Android)</span>
                        </button>
                    </div>
                </div>

                <div class="p-6 md:p-8 bg-slate-50">
                    <h3 id="step2-title" class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4">2. 選擇您的角色</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <button id="btn-host" class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-700 transition-all" onclick="setRole('host')">
                            <span class="text-3xl mb-2">🎤</span>
                            <span id="label-host" class="font-semibold text-sm text-center">會議主持人<br><span class="text-xs font-normal opacity-80">(安裝程式)</span></span>
                        </button>
                        <button id="btn-guest" class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-transparent bg-white text-slate-600 hover:bg-slate-100 transition-all shadow-sm" onclick="setRole('guest')">
                            <span class="text-3xl mb-2">👋</span>
                            <span id="label-guest" class="font-semibold text-sm text-center">訪客<br><span class="text-xs font-normal opacity-80">(透過連結)</span></span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="flex items-center mb-6">
                <div class="h-8 w-2 bg-indigo-500 rounded-full mr-3"></div>
                <h3 id="instructions-header" class="text-2xl font-bold text-slate-800">您的專屬步驟</h3>
            </div>
            
            <p id="context-note" class="text-slate-600 mb-6 bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r text-sm">
                載入中...
            </p>

            <div id="steps-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            </div>
        </section>

        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 mt-12">
            <div class="mb-8">
                <h3 id="trouble-title" class="text-2xl font-bold text-slate-800 mb-2">快速疑難排解儀表板</h3>
                <p id="trouble-desc" class="text-slate-600">
                    查看設定 Teams 時的常見問題。下方的圖表顯示了這些問題的相對發生頻率，幫助您了解使用者最常遇到困難的地方。
                </p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
                <div class="chart-container">
                    <canvas id="issuesChart"></canvas>
                </div>
                
                <div class="overflow-hidden rounded-lg border border-slate-200">
                    <table class="min-w-full divide-y divide-slate-200">
                        <thead class="bg-slate-50" id="table-head">
                        </thead>
                        <tbody class="divide-y divide-slate-200 bg-white" id="table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <footer class="bg-slate-900 text-slate-400 py-8 text-center text-sm mt-auto">
        <p id="footer-text">為會議主持人和訪客生成。最後更新：2026年5月。</p>
    </footer>

                tableHeaders: ["問題", "解決方法"],
                troubleData: [
                    { q: "找不到網頁加入？", a: "請使用電腦。行動裝置必須安裝 App。" },
                    { q: "麥克風/相機無效？", a: "檢查瀏覽器網址列鎖頭圖示或系統隱私權設定。" },

                ],

                chartLabels: ["麥克風/相機權限", "行動裝置網頁加入錯誤", "Safari 不相容", "大廳等待困惑"],

        let issuesChartInstance = null;

        function setLang(lang) {
            state.lang = lang;
            document.getElementById('lang-en').className = lang === 'en' ? 'px-3 py-1 rounded-md text-sm font-medium transition-colors bg-white shadow text-indigo-600' : 'px-3 py-1 rounded-md text-sm font-medium transition-colors text-slate-600 hover:text-slate-900';
            document.getElementById('lang-zh').className = lang === 'zh' ? 'px-3 py-1 rounded-md text-sm font-medium transition-colors bg-white shadow text-indigo-600' : 'px-3 py-1 rounded-md text-sm font-medium transition-colors text-slate-600 hover:text-slate-900';
            renderUI();
        }

        function setDevice(device) {
            state.device = device;
            updateButtons('device', device, ['desktop', 'mobile']);
            renderSteps();
        }

        function setRole(role) {
            state.role = role;
            updateButtons('role', role, ['host', 'guest']);
            renderSteps();
        }

        function updateButtons(type, active, options) {
            options.forEach(opt => {
                const btn = document.getElementById(`btn-${opt}`);
                if (opt === active) {
                    btn.className = 'flex flex-col items-center justify-center p-4 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-700 transition-all';
                } else {
                    btn.className = 'flex flex-col items-center justify-center p-4 rounded-xl border-2 border-transparent bg-white text-slate-600 hover:bg-slate-100 transition-all shadow-sm';
                }
            });
        }

        function renderUI() {
            const t = i18n[state.lang];
            document.getElementById('nav-title').textContent = t.navTitle;
            document.getElementById('hero-title').textContent = t.heroTitle;
            document.getElementById('hero-desc').textContent = t.heroDesc;
            document.getElementById('step1-title').textContent = t.step1Title;
            document.getElementById('label-desktop').innerHTML = t.labelDesktop;
            document.getElementById('label-mobile').innerHTML = t.labelMobile;
            document.getElementById('step2-title').textContent = t.step2Title;
            document.getElementById('label-host').innerHTML = `${t.labelHost}<br><span class="text-xs font-normal opacity-80">(${state.lang === 'zh' ? '安裝程式' : 'Installer'})</span>`;
            document.getElementById('label-guest').innerHTML = `${t.labelGuest}<br><span class="text-xs font-normal opacity-80">(${state.lang === 'zh' ? '透過連結' : 'Via Link'})</span>`;
            document.getElementById('instructions-header').textContent = t.instructionsHeader;
            document.getElementById('trouble-title').textContent = t.troubleTitle;
            document.getElementById('trouble-desc').textContent = t.troubleDesc;
            document.getElementById('footer-text').textContent = t.footerText;
            
            renderSteps();
            renderTable(t);
            renderChart(t);
        }

        function renderSteps() {
            const t = i18n[state.lang];
            const key = `${state.device}_${state.role}`;
            
            document.getElementById('context-note').textContent = t.notes[key];
            
            const steps = t.stepsData[key];
            const container = document.getElementById('steps-container');
            container.innerHTML = '';
            
            steps.forEach((step, index) => {
                let linksHtml = '';
                if (step.links) {
                    linksHtml = `<div class="flex flex-wrap gap-2 mt-3">` + 
                        step.links.map(l => `
                        <a href="${l.url}" target="_blank" class="inline-flex items-center px-3 py-1 rounded-md text-xs font-semibold bg-indigo-600 text-white hover:bg-indigo-700 transition-colors">
                            ${l.label} <span class="ml-1 text-[10px]">↗</span>
                        </a>
                    `).join('') + `</div>`;
                } else if (step.link) {
                    linksHtml = `<a href="${step.link}" target="_blank" class="mt-4 inline-flex items-center text-sm font-bold text-indigo-600 hover:text-indigo-500">${state.lang === 'zh' ? '前往下載頁面' : 'Go to Download'} <span class="ml-1">→</span></a>`;
                }
                
                container.innerHTML += `
                    <div class="step-card bg-white p-6 rounded-xl border border-slate-200 relative overflow-hidden flex flex-col h-full">
                        <div class="absolute top-0 right-0 bg-slate-100 text-slate-400 font-black text-6xl opacity-20 -mt-2 -mr-2 select-none">${index + 1}</div>
                        <div class="text-3xl mb-3">${step.icon}</div>
                        <h4 class="text-lg font-bold text-slate-800 mb-2 relative z-10">${step.title}</h4>
                        <p class="text-slate-600 text-sm relative z-10 flex-grow">${step.text}</p>
                        ${linksHtml}
                    </div>
                `;
            });
        }

        function renderTable(t) {
            document.getElementById('table-head').innerHTML = `
                <tr>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">${t.tableHeaders[0]}</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">${t.tableHeaders[1]}</th>
                </tr>
            `;
            
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            t.troubleData.forEach(row => {
                tbody.innerHTML += `
                    <tr>
                        <td class="px-6 py-4 text-sm font-medium text-slate-900">${row.q}</td>
                        <td class="px-6 py-4 text-sm text-slate-600">${row.a}</td>
                    </tr>
                `;
            });
        }

        function renderChart(t) {
            const ctx = document.getElementById('issuesChart').getContext('2d');
            const dataValues = [45, 25, 20, 10]; 

            if (issuesChartInstance) {
                issuesChartInstance.data.labels = t.chartLabels;
                issuesChartInstance.data.datasets[0].label = t.chartLabel;
                issuesChartInstance.update();
            } else {
                issuesChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: t.chartLabels,
                        datasets: [{
                            label: t.chartLabel,
                            data: dataValues,
                            backgroundColor: ['#4f46e5', '#818cf8', '#c7d2fe', '#e0e7ff'],
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { font: { family: "'Inter', sans-serif" }, color: '#475569' } },
                        },
                        cutout: '65%'
                    }
                });
            }
        }

        renderUI();
    </script>
</body>
</html>
